# 唯一 GUI 配置文件。这里只管一个主界面：收集进度、提交、个人贡献信息和排行榜入口。
# 活动启用哪些收集任务在 activities/<活动id>.yml 的 collections 中配置。
menus:
  main:
    Title: "<#54F6FF>✦ 全服目标 <#8A94A8>| <#FFFFFF>%state%"
    Shape:
      - "####I###C"
      # P 是收集进度按钮。多个 P 会按活动 collections 顺序显示。
      # 例如 collections 是 [wood, stone]，第 1 个 P 显示木头，第 2 个 P 显示石头。
      # 没有对应 collection 的 P 会自动按 - 的材质显示。
      - "#PPPPPPP#"
      - "#PPPPPPP#"
      # 奖励进度和个人排行信息统一放在 C 按钮里显示，不再额外打开奖励 GUI。
      - "#PPPPPPP#"
      - "#PPPPPPP#"
      - "S###X####"
    GuiKey:
      "#":
        Material: BLACK_STAINED_GLASS_PANE
        Name: " "
        Hide-Flags: true
      "-":
        Material: GRAY_STAINED_GLASS_PANE
        Name: " "
        Hide-Flags: true
      "S":
        Material: NETHER_STAR
        Name: "<#54F6FF>✦ 开启全服目标 ✦"
        Lore:
          - "<#8A94A8>管理员专属操作"
          - ""
          - "<#54F6FF>▪ <#B8C7E0>默认活动: <#FFFFFF>%activity%"
          - "<#54F6FF>▪ <#B8C7E0>活动状态: <#FFFFFF>%state%"
          - "<#54F6FF>▪ <#B8C7E0>剩余时间: <#FFFFFF>%remaining%"
          - ""
          - "<#54F6FF>▶ 点击启动默认收集活动"
        Action: start-default
      "I":
        Material: CLOCK
        Name: "<#FFD86B>❖ 全服收集进度"
        Lore:
          - "<#FFD86B>▸ <#B8C7E0>已提交: <#FFFFFF>%total%"
          - "<#FFD86B>▸ <#B8C7E0>总目标: <#FFFFFF>%target%"
          - "<#FFD86B>▸ <#B8C7E0>完成度: <#54F6FF>%percent%%"
          - ""
          - "<#86E7FF>▪ <#B8C7E0>剩余时间: <#FFFFFF>%remaining%"
          - "<#86E7FF>▪ <#B8C7E0>参与玩家: <#FFFFFF>%contribution_players%"
      "P":
        # item-progress：显示某个 collection 的进度，点击只提交这个 collection 对应的材料。
        Action: item-progress
        Name: "<#7CFFB2>📦 收集目标: <#FFFFFF>%item%"
        # 会先显示 activities/<活动id>.yml 中 collection-overrides.<id>.lore 的可提交材料说明。
        # 这里仅追加动态进度，避免重复显示“可提交物”和目标说明。
        Progress-Lore:
          - ""
          - "<#FFD86B>▪ <#B8C7E0>已收集: <#FFFFFF>%item_collected%"
          - "<#FFD86B>▪ <#B8C7E0>仍需要: <#FFD86B>%item_remaining%"
      "C":
        Material: BOOK
        Name: "<#FFD86B>⭐ 个人贡献与历史"
        Lore:
          - "<#FFD86B>▸ <#B8C7E0>你的贡献: <#FFFFFF>%contribution%"
          - "<#FFD86B>▸ <#B8C7E0>当前排名: <#FFFFFF>#%rank%"
          - "<#54F6FF>▸ <#B8C7E0>总贡献人数: <#FFFFFF>%contribution_players%"
          - ""
          - "<#FFD86B>❖ 奖池概览"
          - "<#FFD86B>▪ <#B8C7E0>贡献奖池: <#FFD86B>%contribution_reward_pool%"
          - "<#FFD86B>▪ <#B8C7E0>奖池状态: <#FFFFFF>%contribution_reward_status%"
          - "<#FFD86B>▪ <#B8C7E0>奖励门槛: <#FFFFFF>%contribution_reward_min%"
          - "<#FFD86B>▪ <#B8C7E0>你的资格: <#FFFFFF>%contribution_reward_eligible%"
          - "<#FFD86B>▪ <#B8C7E0>预计可得: <#7CFFB2>%contribution_reward_estimated%"
          - "<#FFD86B>▪ <#B8C7E0>你的占比: <#54F6FF>%contribution_percent%%"
          - ""
          - "<#FFD86B>▶ 点击查看活动历史"
        Action: history
      "X":
        Material: BARRIER
        Name: "<#FF6B6B>✖ 关闭菜单"
        Action: close

  history:
    Title: "<#54F6FF>✦ 活动历史 <#8A94A8>| <#FFFFFF>第 %page% 页"
    Shape:
      - "#########"
      - "#HHHHHHH#"
      - "#HHHHHHH#"
      - "#HHHHHHH#"
      - "#HHHHHHH#"
      - "B###L#R##"
    GuiKey:
      "#":
        Material: BLACK_STAINED_GLASS_PANE
        Name: " "
        Hide-Flags: true
      "H":
        Action: history-entry
        Material: PAPER
        Name: "<#FFD86B>#%history_index% <#FFFFFF>%history_activity%"
        Lore:
          - "<#8A94A8>模板: <#FFFFFF>%history_template%"
          - "<#8A94A8>时间: <#FFFFFF>%history_time%"
          - "<#8A94A8>状态: <#FFFFFF>%history_state%"
          - ""
          - "<#54F6FF>▪ <#B8C7E0>总进度: <#FFFFFF>%history_total%<#8A94A8>/<#FFFFFF>%history_target%"
          - "<#54F6FF>▪ <#B8C7E0>完成度: <#FFFFFF>%history_percent%%"
          - "<#54F6FF>▪ <#B8C7E0>参与人数: <#FFFFFF>%history_participants%"
          - "<#FFD86B>▪ <#B8C7E0>第一名: <#FFFFFF>%history_top1%"
          - ""
          - "<#FFD86B>▪ <#B8C7E0>奖池: <#FFFFFF>%history_reward_pool%"
          - "<#FFD86B>▪ <#B8C7E0>奖励门槛: <#FFFFFF>%history_reward_min%"
          - "<#FFD86B>▪ <#B8C7E0>达标人数: <#FFFFFF>%history_reward_players%"
      "B":
        Material: ARROW
        Name: "<#86E7FF>返回主界面"
        Action: back
      "L":
        Material: SPECTRAL_ARROW
        Name: "<#FFD86B>上一页"
        Action: previous-page
      "R":
        Material: SPECTRAL_ARROW
        Name: "<#FFD86B>下一页"
        Action: next-page

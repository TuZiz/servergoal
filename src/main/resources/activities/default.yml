# =======================================================
# 活动文件：基础木石收集
# 可启用 ID：default
# 命令示例：/sg open default 或 /sg start default
# =======================================================
# [说明] 这是最基础的示例活动，只启用木头和石头两个收集按钮。
# [区别] survival.yml 是完整生存服活动，包含铁套装和金套装收集。
# =======================================================

display-name: "<#54F6FF>✦ <#A8FFB0>基础木石收集 <#54F6FF>✦"
duration-minutes: 120
target-total: 20000

dynamic-target:
  enabled: true
  base-players: 20
  min-multiplier: 1.0
  max-multiplier: 3.0

collections:
  - wood
  - stone

collection-overrides:
  wood:
    display-name: "<#A8FFB0>木材储备"
    item:
      Material: OAK_LOG
      Name: "<#A8FFB0>木材储备"
    lore:
      - ""
      - "<#E0E0E0>可提交木材类物资"
      - "<#54F6FF>▪ <#B8C7E0>主世界: <#FFFFFF>橡木/云杉/白桦/丛林"
      - "<#54F6FF>▪ <#B8C7E0>其他树种: <#FFFFFF>金合欢/樱花/深色橡木/红树"
      - "<#54F6FF>▪ <#B8C7E0>形态: <#FFFFFF>原木/木头/去皮变体"
      - "<#54F6FF>▪ <#B8C7E0>下界: <#FFFFFF>绯红/诡异菌柄与菌核"
      - "<#54F6FF>▪ <#B8C7E0>额外: <#FFFFFF>竹块"
      - ""
      - "<#FFD86B>目标: <#FFFFFF>%item_target%"
      - ""
      - "<#7CFFB2>▶ 点击提交背包内相关物品"

  stone:
    display-name: "<#B8C7E0>石料储备"
    item:
      Material: STONE
      Name: "<#B8C7E0>石料储备"
    lore:
      - ""
      - "<#E0E0E0>可提交石料类物资"
      - "<#54F6FF>▪ <#B8C7E0>基础: <#FFFFFF>石头/圆石/深板岩/圆石深板岩"
      - "<#54F6FF>▪ <#B8C7E0>天然: <#FFFFFF>花岗岩/闪长岩/安山岩/方解石/凝灰岩"
      - "<#54F6FF>▪ <#B8C7E0>磨制: <#FFFFFF>磨制花岗岩/闪长岩/安山岩"
      - ""
      - "<#FFD86B>目标: <#FFFFFF>%item_target%"
      - ""
      - "<#7CFFB2>▶ 点击提交背包内相关物品"

personal-rewards: {}

contribution-reward:
  enabled: true
  pool-amount: 6
  min-contribution: 50
  broadcast-message-key: activity-contribution-distributed
  commands:
    - "tags admin coin give %player% %amount%"

menus:
  main:
    Title-Key: gui.menus.main.title
    Shape:
      - "#########"
      - "#S--I--R#"
      - "#---P---#"
      - "#C--U--Q#"
      - "#---X---#"
      - "#########"
    GuiKey:
      "#":
        Material: BLACK_STAINED_GLASS_PANE
        Name-Key: gui.common.blank
        Hide-Flags: true
      "-":
        Material: GRAY_STAINED_GLASS_PANE
        Name-Key: gui.common.blank
        Hide-Flags: true
      "S":
        Material: NETHER_STAR
        Name-Key: gui.menus.main.status.name
        Lore-Key: gui.menus.main.status.lore
      "I":
        Material: CLOCK
        Name-Key: gui.menus.main.progress.name
        Lore-Key: gui.menus.main.progress.lore
      "P":
        Action: item-progress
        Name-Key: gui.menus.main.item.name
        Lore-Key: gui.menus.main.item.lore
      "C":
        Material: PLAYER_HEAD
        Name-Key: gui.menus.main.contribution.name
        Lore-Key: gui.menus.main.contribution.lore
        Action: top
      "U":
        Material: HOPPER
        Name-Key: gui.menus.main.submit.name
        Lore-Key: gui.menus.main.submit.lore
        Action: submit
      "R":
        Material: CHEST
        Name-Key: gui.menus.main.rewards.name
        Lore-Key: gui.menus.main.rewards.lore
        Action: rewards
      "Q":
        Material: COMPASS
        Name-Key: gui.menus.main.refresh.name
        Lore-Key: gui.menus.main.refresh.lore
        Action: refresh
      "X":
        Material: BARRIER
        Name-Key: gui.menus.main.close.name
        Action: close

  rewards:
    Title-Key: gui.menus.rewards.title
    Shape:
      - "#########"
      - "#---R---#"
      - "#-S-S-S-#"
      - "#-P-P-P-#"
      - "#B-V-N-X#"
      - "#########"
    GuiKey:
      "#":
        Material: BLACK_STAINED_GLASS_PANE
        Name-Key: gui.common.blank
        Hide-Flags: true
      "-":
        Material: GRAY_STAINED_GLASS_PANE
        Name-Key: gui.common.blank
        Hide-Flags: true
      "R":
        Material: CHEST
        Name-Key: gui.menus.rewards.summary.name
        Lore-Key: gui.menus.rewards.summary.lore
      "S":
        Action: claim-stage
        Name-Key: gui.menus.rewards.stage.name
        Lore-Key: gui.menus.rewards.stage.lore
      "P":
        Action: claim-personal
        Name-Key: gui.menus.rewards.personal.name
        Lore-Key: gui.menus.rewards.personal.lore
      "B":
        Material: ARROW
        Name-Key: gui.menus.rewards.back.name
        Action: back
      "V":
        Material: ARROW
        Name-Key: gui.menus.rewards.previous.name
        Action: previous-page
      "N":
        Material: PAPER
        Name-Key: gui.menus.rewards.next.name
        Action: next-page
      "X":
        Material: BARRIER
        Name-Key: gui.menus.rewards.close.name
        Action: close

  top:
    Title-Key: gui.menus.top.title
    Shape:
      - "#########"
      - "#---S---#"
      - "#OOOOOOO#"
      - "#OOOOOOO#"
      - "#B-V-N-X#"
      - "#########"
    GuiKey:
      "#":
        Material: BLACK_STAINED_GLASS_PANE
        Name-Key: gui.common.blank
        Hide-Flags: true
      "-":
        Material: GRAY_STAINED_GLASS_PANE
        Name-Key: gui.common.blank
        Hide-Flags: true
      "S":
        Material: PLAYER_HEAD
        Name-Key: gui.menus.top.summary.name
        Lore-Key: gui.menus.top.summary.lore
      "O":
        Material: PLAYER_HEAD
        Action: top-entry
        Name-Key: gui.menus.top.entry.name
        Lore-Key: gui.menus.top.entry.lore
      "B":
        Material: ARROW
        Name-Key: gui.menus.top.back.name
        Action: back
      "V":
        Material: ARROW
        Name-Key: gui.menus.top.previous.name
        Action: previous-page
      "N":
        Material: PAPER
        Name-Key: gui.menus.top.next.name
        Action: next-page
      "X":
        Material: BARRIER
        Name-Key: gui.menus.top.close.name
        Action: close

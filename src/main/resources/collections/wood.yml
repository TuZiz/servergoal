# 收集任务文件：只配置“什么物品算木头”和这个任务自己的目标量。
# GUI 展示 Lore 放在 activities/<活动id>.yml 的 collection-overrides 中。
display-name: "<#A8FFB0>木头"
target: 10000

# 代表物品和默认展示图标。真正能提交哪些材料由 match 决定。
item:
  Material: OAK_LOG
  Name: "<#A8FFB0>木头收集"

match:
  # false 表示不锁定单一 Material，改用下面 materials 白名单。
  material: false
  # 只要玩家背包里的物品 Material 命中这里，就算作木头提交。
  materials:
    - OAK_LOG
    - SPRUCE_LOG
    - BIRCH_LOG
    - JUNGLE_LOG
    - ACACIA_LOG
    - CHERRY_LOG
    - DARK_OAK_LOG
    - MANGROVE_LOG
    - OAK_WOOD
    - SPRUCE_WOOD
    - BIRCH_WOOD
    - JUNGLE_WOOD
    - ACACIA_WOOD
    - CHERRY_WOOD
    - DARK_OAK_WOOD
    - MANGROVE_WOOD
    - STRIPPED_OAK_LOG
    - STRIPPED_SPRUCE_LOG
    - STRIPPED_BIRCH_LOG
    - STRIPPED_JUNGLE_LOG
    - STRIPPED_ACACIA_LOG
    - STRIPPED_CHERRY_LOG
    - STRIPPED_DARK_OAK_LOG
    - STRIPPED_MANGROVE_LOG
    - STRIPPED_OAK_WOOD
    - STRIPPED_SPRUCE_WOOD
    - STRIPPED_BIRCH_WOOD
    - STRIPPED_JUNGLE_WOOD
    - STRIPPED_ACACIA_WOOD
    - STRIPPED_CHERRY_WOOD
    - STRIPPED_DARK_OAK_WOOD
    - STRIPPED_MANGROVE_WOOD
    - CRIMSON_STEM
    - WARPED_STEM
    - CRIMSON_HYPHAE
    - WARPED_HYPHAE
    - STRIPPED_CRIMSON_STEM
    - STRIPPED_WARPED_STEM
    - STRIPPED_CRIMSON_HYPHAE
    - STRIPPED_WARPED_HYPHAE
    - BAMBOO_BLOCK
  # 下面为 false 时，不要求物品名字、NBT、CustomModelData 或 ItemModel 完全一致。
  item-meta: false
  display-name: false
  custom-model-data: false
  item-model: false

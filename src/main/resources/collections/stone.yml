# 收集任务文件：只配置“什么物品算石头”和这个任务自己的目标量。
# GUI 展示 Lore 放在 activities/<活动id>.yml 的 collection-overrides 中。
display-name: "<#B8C7E0>石头"
target: 10000

# 代表物品和默认展示图标。真正能提交哪些材料由 match 决定。
item:
  Material: STONE
  Name: "<#B8C7E0>石头收集"

match:
  # false 表示不锁定单一 Material，改用下面 materials 白名单。
  material: false
  # 只要玩家背包里的物品 Material 命中这里，就算作石头提交。
  materials:
    - STONE
    - COBBLESTONE
    - DEEPSLATE
    - COBBLED_DEEPSLATE
    - GRANITE
    - DIORITE
    - ANDESITE
    - POLISHED_GRANITE
    - POLISHED_DIORITE
    - POLISHED_ANDESITE
    - CALCITE
    - TUFF
  # 下面为 false 时，不要求物品名字、NBT、CustomModelData 或 ItemModel 完全一致。
  item-meta: false
  display-name: false
  custom-model-data: false
  item-model: false
